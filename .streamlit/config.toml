[theme]
base = "dark"
primaryColor = "#D4AF37"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B26"
textColor = "#F2F2F2"
font = "sans serif"

[server]
headless = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = true
